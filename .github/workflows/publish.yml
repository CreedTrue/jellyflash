name: Publish Release

on:
  release:
    types:
      - released
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Git tag to attach assets to (the release must already exist)"
        required: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      dotnet-version: "9.0.x"
      dotnet-target: "net9.0"

  upload:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          merge-multiple: true
      - name: Compute Checksums
        run: |-
          for file in ./*; do
            md5sum "${file#./}" > "${file%.*}.md5"
            sha256sum "${file#./}" > "${file%.*}.sha256"
          done
      - name: Publish Output Assets
        id: publish-assets
        uses: softprops/action-gh-release@v2.6.2
        with:
          prerelease: ${{ github.event.release.prerelease || false }}
          tag_name: ${{ github.event.release.tag_name || inputs.tag_name }}
          files: |
            ./*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  manifest:
    runs-on: ubuntu-latest
    needs: [upload]
    steps:
      - name: Generate Manifest
        uses: Kevinjil/jellyfin-plugin-repo-action@a7832ecc44c6b1a45d531970f6647b8682b005b8 # v0.4.0
        with:
          ignorePrereleases: true
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          pagesBranch: manifest-release
          pagesFile: manifest.json